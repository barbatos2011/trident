# This workflow downloads artifacts from AWS S3 that were previously uploaded by the build-xxxx.yml workflow.
# It can optionally sign the downloaded artifacts using GPG and upload the signed artifacts back to S3.
#
# Required inputs:
# - s3-path: The S3 path for this build (e.g., v1.0.0-{YYYYMMDD-HHMMSS}-{7-characters-commit-hash}-plt-jdk)
# - gpg-fingerprint: GPG key fingerprint for signing
#
# Optional inputs:
# - download-dir: Directory to download files to (default: ./downloads)

name: Sign - Artifacts

on:
  workflow_dispatch:
    inputs:
      project_version:
        description: "Project version (e.g. 1.0.0)"
        required: true
        default: ""

jobs:
  download-from-s3-and-sign:
    name: Download from S3
    runs-on: self-hosted

    # Define environment variables for reuse
    env:
      DOWNLOAD_DIR: "./io/github/tronprotocol/trident/${{ inputs.project_version }}"

    permissions:
      contents: read
      id-token: write # Needed for AWS credential provider

    steps:
      - name: Set S3 path
        run: |
          echo "S3_PATH=${{ secrets.S3_BUCKET }}/${{ secrets.S3_PREFIX }}/${{ github.event.inputs.project_version }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DOWNLOAD }} # 👈 replace with your IAM role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create download directory
        run: mkdir -p ${{ env.DOWNLOAD_DIR }}

      - name: Download files from S3
        run: |
          echo "Downloading files from ${{ env.S3_PATH }}"
          aws s3 cp s3://${{ env.S3_PATH }}/ ${{ env.DOWNLOAD_DIR }}/ --recursive --exclude "*" --include "trident-0.10.0*"

          # Verify download was successful
          if [ -z "$(ls -A ${{ env.DOWNLOAD_DIR }})" ]; then
            echo "Error: Failed to download files from S3"
            exit 1
          else
            echo "Download from S3 completed successfully"
            ls -l "${{ env.DOWNLOAD_DIR }}" | awk '{ $3=""; $4=""; print }'
          fi

      - name: Create download summary
        run: |
          echo "## S3 Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "Downloaded files from \`${{ env.S3_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Path:** \`$${{ env.S3_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloaded Files:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -l "${{ env.DOWNLOAD_DIR }}" | awk '{ $3=""; $4=""; print }' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: List files to sign
        run: |
          echo "Files to sign:"
          ls -l ${{ env.DOWNLOAD_DIR }} | awk '{ $3=""; $4=""; print }'

      - name: Sign artifacts
        run: |
          # Sign each JAR file
          PREFIX="${{ env.DOWNLOAD_DIR }}/trident-${{ github.event.inputs.project_version }}"

          files=(
              "${PREFIX}.jar"
              "${PREFIX}-sources.jar"
              "${PREFIX}-javadoc.jar"
              "${PREFIX}.pom"
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "Signing $file"
              # 生成GPG签名
              gpg --local-user ${{ secrets.gpg-fingerprint }} --armor --detach-sign ${file}
              # 生成校验和 (Mac系统专用命令)
              md5 ${file} | awk '{print $NF}' > ${file}.md5
              shasum -a 1 ${file} | awk '{print $1}' > ${file}.sha1
              shasum -a 256 ${file} | awk '{print $1}' > ${file}.sha256
              shasum -a 512 ${file} | awk '{print $1}' > ${file}.sha512
              # 为签名文件生成校验和
              md5 ${file}.asc | awk '{print $NF}' > ${file}.asc.md5
              shasum -a 1 ${file}.asc | awk '{print $1}' > ${file}.asc.sha1
              shasum -a 256 ${file}.asc | awk '{print $1}' > ${file}.asc.sha256
              shasum -a 512 ${file}.asc | awk '{print $1}' > ${file}.asc.sha512
            fi
          done

          # Verify signature files were created
          echo "Signature files created:"
          ls -l ${{ env.DOWNLOAD_DIR }}/*.sig | awk '{ $3=""; $4=""; print }' || echo "No signature files found"

      - name: Create signing summary
        run: |
          echo "## Signing Summary" >> $GITHUB_STEP_SUMMARY
          echo "Signed artifacts for \`${{ env.S3_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Signed Files:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -l ${{ env.DOWNLOAD_DIR }} | awk '{ $3=""; $4=""; print }' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Gzip files
        run: |
          zip -r trident-${{ inputs.project_version }}-bundle.zip io/

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trident-${{ inputs.project_version }}-bundle.zip
          path: "./trident-${{ inputs.project_version }}-bundle.zip"
          if-no-files-found: error

  upload-signed-to-s3:
    name: Upload Signed Artifacts to S3
    runs-on: ubuntu-22.04
    needs: download-from-s3-and-sign

    permissions:
      actions: read
      contents: read
      id-token: write # Needed for AWS credential provider

    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: trident-${{ inputs.project_version }}-bundle.zip
          path: ./signed-artifacts/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_UPLOAD_TEST }} # 👈 replace with your IAM role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set S3 path for signed artifacts
        run: |
          S3_SIGNED_PATH="s3://${{ secrets.S3_BUCKET_TEST }}"
          if [ -n "${{ secrets.S3_PREFIX }}" ]; then
              S3_SIGNED_PATH="$S3_SIGNED_PATH/${{ secrets.S3_PREFIX }}"
          fi
          S3_SIGNED_PATH="$S3_SIGNED_PATH/${{ github.event.inputs.project_version }}"

      - name: Upload signed artifacts to S3
        run: |
          echo "Uploading signed artifacts to s3://${{ env.S3_SIGNED_PATH }}/"
          aws s3 cp "./signed-artifacts/" "s3://${{ env.S3_SIGNED_PATH }}/" --recursive
          echo "Upload of signed artifacts to S3 completed successfully"
